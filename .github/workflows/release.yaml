name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  Release:
    runs-on: ubuntu-latest
    env:
      ACCESS_TOKEN: ${{ secrets.SNBOT_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: '${{ github.ref }}'
          fetch-depth: 0

      - name: Set Tag as Environment Variable
        id: set_tag
        run: |
          set -o pipefail
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          echo "GORELEASER_CURRENT_TAG=$CURRENT_TAG" >> "$GITHUB_ENV"

          # Only stable vMAJOR.MINOR.PATCH tags delimit release notes.
          LAST_TAG="$(
            git tag --merged "$CURRENT_TAG" --sort=-version:refname |
              awk -v current_tag="$CURRENT_TAG" '
                $0 != current_tag && $0 ~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ {
                  print
                  exit
                }
              '
          )"
          if [ -z "$LAST_TAG" ]; then
            echo "No previous stable release tag found for $CURRENT_TAG" >&2
            exit 1
          fi
          echo "GORELEASER_PREVIOUS_TAG=$LAST_TAG" >> "$GITHUB_ENV"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@111c56156bcc6918c056dbef52164cfa583dc549 # v5.2.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PRIVATE_KEY_PASSPHRASE }}
      - name: Setup Git token
        run: |
          git config --global user.email "snbot@streamnative.io"
          git config --global user.name "StreamNative Bot"
          git config --global url."https://streamnativebot:${ACCESS_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: goreleaser release (without release notes)
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean --timeout 60m
        env:
          GITHUB_TOKEN: ${{ secrets.SNBOT_GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

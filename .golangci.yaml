version: "2"

run:
  timeout: 6m

linters:
  default: none
  enable:
    - bodyclose
    - gocritic
    - govet
    - ineffassign
    - lll
    - misspell
    - prealloc
    - staticcheck
    - unconvert
    - unparam
    - unused
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
